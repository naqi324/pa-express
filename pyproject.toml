[project]
name = "pa-express"
version = "0.1.0"
description = "Prior Auth Express — prior authorization automation demo backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "pydantic-settings>=2.7.0",
  "uvicorn[standard]>=0.32.0",
  "boto3>=1.35.0"
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0"
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
addopts = "-q"
pythonpath = ["."]
